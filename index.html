<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canlı Spor Ekranı - Stüdyo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #111622;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e50914;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .logo span {
      color: #e50914;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ff3333;
      background: rgba(229, 9, 20, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(229, 9, 20, 0.3);
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #ff3333;
      border-radius: 50%;
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(255, 51, 51, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 96px);
      overflow: hidden;
    }

    .main-stage {
      flex: 2.8;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at center, #192233 0%, #0b0e14 85%);
      padding: 20px 30px;
      overflow-y: auto;
      gap: 16px;
    }

    .stage-card {
      width: 100%;
      background: rgba(17, 22, 34, 0.85);
      border: 1px solid #232d42;
      border-radius: 12px;
      padding: 20px 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      text-align: center;
    }

    .stage-card .league-meta {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .team {
      flex: 1;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .score-display {
      font-size: 2.8rem;
      font-weight: 900;
      padding: 0 20px;
      color: #38bdf8;
      letter-spacing: 2px;
    }

    .scorers-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px dashed rgba(255,255,255,0.08);
      text-align: left;
    }

    .team-events-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.78rem;
    }

    .team-events-col.away-col {
      text-align: right;
    }

    .scorer-line {
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scorer-line.own-goal {
      color: #f87171;
    }

    .away-col .scorer-line {
      justify-content: flex-end;
    }

    .scorer-time {
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .scorer-assist {
      color: #64748b;
      font-size: 0.72rem;
      font-style: italic;
    }

    .kk-badge {
      font-size: 0.65rem;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
    }

    .p-badge {
      font-size: 0.65rem;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
    }

    .match-tag {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .match-tag.live {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .detail-card {
      background: rgba(17, 22, 34, 0.75);
      border: 1px solid #20293a;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-card-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #232d42;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-card-title .badge {
      font-size: 0.7rem;
      background: #1e293b;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
    }

    .stat-labels {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
      font-weight: 600;
    }

    .stat-title {
      color: #94a3b8;
    }

    .lineups-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .lineup-col {
      background: #131926;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lineup-team-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #38bdf8;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #e2e8f0;
    }

    .player-num {
      width: 20px;
      height: 20px;
      background: #1e293b;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .player-pos {
      color: #64748b;
      font-size: 0.7rem;
      margin-left: auto;
    }

    .match-info-box {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .match-info-box strong {
      color: #f1f5f9;
    }

    .sidebar {
      flex: 1.2;
      background: #111622;
      border-left: 1px solid #20293a;
      display: flex;
      flex-direction: column;
    }

    .league-selection-box {
      padding: 12px;
      background: #0d121c;
      border-bottom: 1px solid #20293a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .league-dropdown {
      width: 100%;
      background: #171f2e;
      color: #fff;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .quick-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-btn {
      padding: 4px 10px;
      background: #171f2e;
      border: 1px solid #232d42;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .badge-btn:hover { background: #232d42; color: #fff; }
    .badge-btn.active { background: #e50914; border-color: #e50914; color: #fff; }

    .match-feed {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-card {
      background: #171f2e;
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid #475569;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .feed-card:hover {
      background: #1f2a3f;
      transform: translateX(-2px);
    }

    .feed-card.active-selected {
      border-color: #38bdf8;
      background: #1a2538;
    }

    .feed-card.LIVE { border-left-color: #e50914; background: #201a24; }
    .feed-card.FT { border-left-color: #22c55e; }
    .feed-card.NS { border-left-color: #38bdf8; }

    .feed-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .feed-header .status-txt { font-weight: 700; }
    .feed-card.LIVE .status-txt { color: #ff4d4f; }
    .feed-card.FT .status-txt { color: #4ade80; }
    .feed-card.NS .status-txt { color: #38bdf8; }

    .feed-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .feed-body .match-teams {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .feed-body .match-score-badge {
      font-weight: 800;
      font-size: 0.95rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.3);
      color: #f8fafc;
    }

    .ticker-container {
      height: 40px;
      background: #080a0f;
      border-top: 1px solid #20293a;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .ticker-badge {
      background: #e50914;
      color: #fff;
      font-weight: 900;
      font-size: 0.8rem;
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      z-index: 5;
      letter-spacing: 0.5px;
      box-shadow: 4px 0 12px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-track {
      display: inline-flex;
      white-space: nowrap;
      animation: ticker-anim 40s linear infinite;
    }

    .ticker-track:hover { animation-play-state: paused; }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      padding: 0 20px;
      font-size: 0.82rem;
      color: #cbd5e1;
      border-right: 1px solid #1e293b;
    }

    @keyframes ticker-anim {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CANLI<span>SPOR</span></div>
    <div class="live-badge">
      <span class="pulse"></span> CANLI AKIŞ
    </div>
  </header>

  <div class="container">
    <main class="main-stage">
      <div class="stage-card" id="stageCard">
        <div class="league-meta" id="stageMeta">Yükleniyor...</div>
        <div class="scoreboard">
          <div class="team" id="stageHome">-</div>
          <div class="score-display" id="stageScore">-</div>
          <div class="team" id="stageAway">-</div>
        </div>

        <div class="scorers-summary-grid">
          <div class="team-events-col" id="homeEventsList"></div>
          <div class="team-events-col away-col" id="awayEventsList"></div>
        </div>

        <div class="match-tag" id="stageTag">BEKLENİYOR</div>
      </div>

      <div class="detail-card" style="width: 100%;">
        <div class="detail-card-title">
          <span>👥 İlk 11 / Kadrolar</span>
          <span class="badge" id="lineupBadge">Muhtemel / Resmi</span>
        </div>
        <div class="lineups-container">
          <div class="lineup-col">
            <div class="lineup-team-title">
              <span id="lineupHomeName">Ev Sahibi</span>
              <span id="lineupHomeForm">-</span>
            </div>
            <div id="homeLineupList" style="display:flex; flex-direction:column; gap:4px;">
              <span style="color:#64748b; font-size:0.75rem;">Kadro açıklanmadı.</span>
            </div>
          </div>
          <div class="lineup-col">
            <div class="lineup-team-title">
              <span id="lineupAwayName">Deplasman</span>
              <span id="lineupAwayForm">-</span>
            </div>
            <div id="awayLineupList" style="display:flex; flex-direction:column; gap:4px;">
              <span style="color:#64748b; font-size:0.75rem;">Kadro açıklanmadı.</span>
            </div>
          </div>
        </div>
      </div>

      <div class="detail-card" style="width: 100%;">
        <div class="detail-card-title">📊 Takım Karşılaştırması</div>
        <div class="stats-list" id="statsContainer">
          <div style="color:#64748b; font-size:0.8rem;">İstatistik bulunamadı.</div>
        </div>
      </div>

      <div class="detail-card" style="width: 100%;">
        <div class="match-info-box">
          <div><strong>Stadyum:</strong> <span id="venueText">-</span></div>
          <div><strong>Hakem:</strong> <span id="refereeText">-</span></div>
        </div>
      </div>
    </main>

    <aside class="sidebar">
      <div class="league-selection-box">
        <select class="league-dropdown" id="leagueSelect" onchange="onSelectLeague(this.value)">
          <option value="superlig">🇹🇷 Trendyol Süper Lig</option>
          <option value="premier">🇬🇧 Premier League</option>
          <option value="laliga">🇪🇸 La Liga</option>
          <option value="seriea">🇮🇹 Serie A</option>
          <option value="bundesliga">🇩🇪 Bundesliga</option>
          <option value="ligue1">🇫🇷 Ligue 1</option>
          <option value="eredivisie">🇳🇱 Eredivisie</option>
          <option value="ligaportugal">🇵🇹 Liga Portugal</option>
          <option value="saudi">🇸🇦 Suudi Pro Ligi</option>
          <option value="ucl">⭐ UEFA Şampiyonlar Ligi</option>
          <option value="uel">🏆 UEFA Avrupa Ligi</option>
          <option value="uecl">🟢 UEFA Konferans Ligi</option>
        </select>

        <div class="quick-badges">
          <button class="badge-btn active" onclick="setLeague('superlig')">Süper Lig</button>
          <button class="badge-btn" onclick="setLeague('premier')">Premier</button>
          <button class="badge-btn" onclick="setLeague('laliga')">La Liga</button>
          <button class="badge-btn" onclick="setLeague('saudi')">Arabistan</button>
          <button class="badge-btn" onclick="setLeague('ucl')">UCL</button>
          <button class="badge-btn" onclick="setLeague('uecl')">Konferans</button>
        </div>
      </div>

      <div class="match-feed" id="matchFeed"></div>
    </aside>
  </div>

  <div class="ticker-container">
    <div class="ticker-badge">SKORLAR</div>
    <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </div>

  <script>
    let activeLeague = 'superlig';
    let currentMatches = [];
    let selectedMatchId = null;

    async function loadData() {
      try {
        const res = await fetch(`/api/fixtures?league=${activeLeague}`);
        const data = await res.json();
        currentMatches = data.matches || [];
        
        renderSidebar(currentMatches);
        
        if (currentMatches.length > 0) {
          const matchToSelect = currentMatches.find(m => m.id === selectedMatchId) || currentMatches[0];
          selectMatch(matchToSelect);
        }
        renderTicker(currentMatches);
      } catch (err) {
        console.error("Veri çekilemedi:", err);
      }
    }

    function setLeague(leagueKey) {
      activeLeague = leagueKey;
      selectedMatchId = null;
      document.getElementById('leagueSelect').value = leagueKey;
      document.querySelectorAll('.badge-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(leagueKey));
      });
      loadData();
    }

    function onSelectLeague(leagueKey) {
      activeLeague = leagueKey;
      selectedMatchId = null;
      document.querySelectorAll('.badge-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(leagueKey));
      });
      loadData();
    }

    async function selectMatch(match) {
      if (!match) return;
      selectedMatchId = match.id;
      
      document.querySelectorAll('.feed-card').forEach(card => card.classList.remove('active-selected'));
      const activeCard = document.getElementById(`card-${match.id}`);
      if (activeCard) activeCard.classList.add('active-selected');

      const metaText = match.round ? `${match.league} • ${match.round}` : match.league;
      document.getElementById('stageMeta').innerText = metaText;
      document.getElementById('stageHome').innerText = match.homeTeam;
      document.getElementById('stageAway').innerText = match.awayTeam;
      document.getElementById('stageScore').innerText = match.score;
      
      const tag = document.getElementById('stageTag');
      if (match.status === 'LIVE') {
        tag.className = 'match-tag live';
        tag.innerText = match.minute;
      } else {
        tag.className = 'match-tag';
        tag.innerText = match.fullDate || match.time;
      }

      document.getElementById('lineupHomeName').innerText = match.homeTeam;
      document.getElementById('lineupAwayName').innerText = match.awayTeam;

      document.getElementById('homeEventsList').innerHTML = '';
      document.getElementById('awayEventsList').innerHTML = '';

      try {
        const detailRes = await fetch(`/api/match-detail?event_id=${match.id}&league_slug=${match.leagueSlug}`);
        const detail = await detailRes.json();
        
        document.getElementById('venueText').innerText = detail.venue || '-';
        document.getElementById('refereeText').innerText = detail.referee || '-';

        const homeList = document.getElementById('homeEventsList');
        const awayList = document.getElementById('awayEventsList');

        if (detail.homeEvents && detail.homeEvents.length > 0) {
          homeList.innerHTML = detail.homeEvents.map(ev => `
            <div class="scorer-line ${ev.isOwnGoal ? 'own-goal' : ''}">
              <span>${ev.icon}</span>
              <strong>${ev.scorer}</strong>
              ${ev.isOwnGoal ? '<span class="kk-badge">K.K.</span>' : ''}
              ${ev.isPenalty ? '<span class="p-badge">P</span>' : ''}
              <span class="scorer-time">${ev.clock}</span>
              ${ev.assist ? `<span class="scorer-assist">${ev.assist}</span>` : ''}
            </div>
          `).join('');
        }

        if (detail.awayEvents && detail.awayEvents.length > 0) {
          awayList.innerHTML = detail.awayEvents.map(ev => `
            <div class="scorer-line ${ev.isOwnGoal ? 'own-goal' : ''}">
              ${ev.assist ? `<span class="scorer-assist">${ev.assist}</span>` : ''}
              <span class="scorer-time">${ev.clock}</span>
              ${ev.isOwnGoal ? '<span class="kk-badge">K.K.</span>' : ''}
              ${ev.isPenalty ? '<span class="p-badge">P</span>' : ''}
              <strong>${ev.scorer}</strong>
              <span>${ev.icon}</span>
            </div>
          `).join('');
        }

        const lineups = detail.lineups || {};
        document.getElementById('lineupBadge').innerText = lineups.isOfficial ? "Resmi 11'ler" : "Muhtemel / Kadro";
        document.getElementById('lineupHomeForm').innerText = lineups.homeFormation || "";
        document.getElementById('lineupAwayForm').innerText = lineups.awayFormation || "";

        const homeLineupList = document.getElementById('homeLineupList');
        const awayLineupList = document.getElementById('awayLineupList');

        if (lineups.home && lineups.home.length > 0) {
          homeLineupList.innerHTML = lineups.home.map(p => `
            <div class="player-row">
              <div class="player-num">${p.jersey || "-"}</div>
              <span>${p.name}</span>
              <span class="player-pos">${p.pos || ""}</span>
            </div>
          `).join('');
        } else {
          homeLineupList.innerHTML = '<span style="color:#64748b; font-size:0.75rem;">Kadro açıklanmadı.</span>';
        }

        if (lineups.away && lineups.away.length > 0) {
          awayLineupList.innerHTML = lineups.away.map(p => `
            <div class="player-row">
              <div class="player-num">${p.jersey || "-"}</div>
              <span>${p.name}</span>
              <span class="player-pos">${p.pos || ""}</span>
            </div>
          `).join('');
        } else {
          awayLineupList.innerHTML = '<span style="color:#64748b; font-size:0.75rem;">Kadro açıklanmadı.</span>';
        }

        const statsContainer = document.getElementById('statsContainer');
        if (detail.stats && detail.stats.length > 0) {
          statsContainer.innerHTML = detail.stats.map(st => `
            <div class="stat-row">
              <div class="stat-labels">
                <span>${st.home}</span>
                <span class="stat-title">${st.title}</span>
                <span>${st.away}</span>
              </div>
            </div>
          `).join('');
        } else {
          statsContainer.innerHTML = '<div style="color:#64748b; font-size:0.8rem; padding:10px 0;">Maç istatistikleri mevcut değil.</div>';
        }
      } catch (err) {
        console.error("Detay çekilemedi:", err);
      }
    }

    function renderSidebar(matches) {
      const feed = document.getElementById('matchFeed');
      if (!matches.length) {
        feed.innerHTML = '<div style="color:#64748b; text-align:center; padding:30px;">Bu hafta için maç bulunamadı.</div>';
        return;
      }

      feed.innerHTML = matches.map((m) => `
        <div class="feed-card ${m.status} ${m.id === selectedMatchId ? 'active-selected' : ''}" id="card-${m.id}" onclick='selectMatch(${JSON.stringify(m)})'>
          <div class="feed-header">
            <span>${m.round || m.league}</span>
            <span class="status-txt">${m.time}</span>
          </div>
          <div class="feed-body">
            <div class="match-teams">
              <span>${m.homeTeam}</span>
              <span>${m.awayTeam}</span>
            </div>
            <div class="match-score-badge">${m.score}</div>
          </div>
        </div>
      `).join('');
    }

    function renderTicker(matches) {
      const track = document.getElementById('tickerTrack');
      if (!matches.length) return;
      
      const itemsHtml = matches.map(m => `
        <div class="ticker-item">
          <strong>${m.homeTeam}</strong>&nbsp;${m.score}&nbsp;<strong>${m.awayTeam}</strong>
          &nbsp;<span style="color:${m.status==='LIVE' ? '#e50914' : (m.status==='FT' ? '#4ade80' : '#38bdf8')}">(${m.time})</span>
        </div>
      `).join('');

      track.innerHTML = itemsHtml + itemsHtml;
    }

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
